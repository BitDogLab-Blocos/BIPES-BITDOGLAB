<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2600" height="2600" viewBox="0 0 2600 2600" role="img" aria-labelledby="title desc">
  <title id="title">Projeto elétrico da placa de conexões externas BitDogLab</title>
  <desc id="desc">Prancha em preto e branco com seis quadros contendo os esquemas do LDR, DHT11, HC-SR04 Plus, MPU-6050, LED RGB e servo SG90.</desc>

  <rect width="2600" height="2600" fill="#ffffff"/>

  <!-- Moldura e divisões da prancha -->
  <g fill="none" stroke="#000000" stroke-width="6">
    <rect x="40" y="40" width="2520" height="2520"/>
    <line x1="40" y1="160" x2="2560" y2="160"/>
    <line x1="1300" y1="160" x2="1300" y2="2365"/>
    <line x1="40" y1="895" x2="2560" y2="895"/>
    <line x1="40" y1="1630" x2="2560" y2="1630"/>
    <line x1="40" y1="2365" x2="2560" y2="2365"/>
    <line x1="1880" y1="2365" x2="1880" y2="2560"/>
  </g>

  <!-- Título principal -->
  <g fill="#000000" font-family="Arial, Helvetica, sans-serif">
    <text x="1300" y="112" text-anchor="middle" font-size="54" font-weight="700">PROJETO ELÉTRICO — CONEXÕES EXTERNAS BITDOGLAB</text>

    <!-- Títulos dos quadros -->
    <text x="80" y="212" font-size="34" font-weight="700">01 — LDR / DIVISOR DE TENSÃO</text>
    <text x="1340" y="212" font-size="34" font-weight="700">02 — SENSOR DHT11</text>
    <text x="80" y="947" font-size="34" font-weight="700">03 — HC-SR04 PLUS / I²C</text>
    <text x="1340" y="947" font-size="34" font-weight="700">04 — GY-521 / MPU-6050</text>
    <text x="80" y="1682" font-size="34" font-weight="700">05 — LED RGB / CÁTODO COMUM</text>
    <text x="1340" y="1682" font-size="34" font-weight="700">06 — MICROSERVO SG90</text>
  </g>

  <!-- Esquemáticos -->
  <image href="ldr-divisor-tensao.svg" xlink:href="ldr-divisor-tensao.svg" x="65" y="225" width="1210" height="645" preserveAspectRatio="xMidYMid meet"/>
  <image href="dht11.svg" xlink:href="dht11.svg" x="1325" y="225" width="1210" height="645" preserveAspectRatio="xMidYMid meet"/>
  <image href="hc-sr04-plus-i2c.svg" xlink:href="hc-sr04-plus-i2c.svg" x="65" y="960" width="1210" height="645" preserveAspectRatio="xMidYMid meet"/>
  <image href="mpu6050-gy521.svg" xlink:href="mpu6050-gy521.svg" x="1325" y="960" width="1210" height="645" preserveAspectRatio="xMidYMid meet"/>
  <image href="led-rgb-catodo-comum.svg" xlink:href="led-rgb-catodo-comum.svg" x="65" y="1695" width="1210" height="645" preserveAspectRatio="xMidYMid meet"/>
  <image href="servo-sg90.svg" xlink:href="servo-sg90.svg" x="1325" y="1695" width="1210" height="645" preserveAspectRatio="xMidYMid meet"/>

  <!-- Bloco de identificação -->
  <g fill="#000000" font-family="Arial, Helvetica, sans-serif">
    <text x="80" y="2420" font-size="35" font-weight="700">PLACA DE CONEXÕES EXTERNAS — BITDOGLAB</text>
    <text x="80" y="2470" font-size="27">Fonte: placa-conexoes-externas-bitdoglab.fzz</text>
    <text x="80" y="2515" font-size="27">Alimentação: 3,3 V para sensores · 5 V para o servo · GND comum</text>

    <text x="1390" y="2435" font-size="24" font-weight="700">AUTOR</text>
    <text x="1390" y="2495" font-size="34">Jonas Souza</text>

    <text x="1920" y="2420" font-size="28" font-weight="700">PRANCHA</text>
    <text x="2380" y="2420" text-anchor="end" font-size="28">01/01</text>
    <text x="1920" y="2470" font-size="28" font-weight="700">CONTEÚDO</text>
    <text x="1920" y="2515" font-size="26">Ligações dos periféricos</text>
  </g>
</svg>
