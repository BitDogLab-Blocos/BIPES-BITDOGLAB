<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Ligação do microservo SG90</title>
  <desc id="desc">Microservo SG90 alimentado em 5 volts, sinal PWM ligado à conexão selecionada e terra comum.</desc>
  <rect width="1200" height="700" fill="#ffffff"/>

  <g fill="none" stroke="#000000" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter">
    <rect x="650" y="120" width="330" height="430" fill="#ffffff"/>

    <!-- Alimentação de 5 V -->
    <circle cx="175" cy="190" r="8" fill="#ffffff"/>
    <line x1="183" y1="190" x2="650" y2="190"/>

    <!-- Sinal PWM -->
    <circle cx="175" cy="345" r="8" fill="#ffffff"/>
    <line x1="183" y1="345" x2="650" y2="345"/>

    <!-- Terra -->
    <line x1="500" y1="490" x2="650" y2="490"/>
    <line x1="500" y1="490" x2="500" y2="600"/>
    <line x1="450" y1="600" x2="550" y2="600"/>
    <line x1="465" y1="617" x2="535" y2="617"/>
    <line x1="482" y1="634" x2="518" y2="634"/>

    <!-- Símbolo mecânico simples -->
    <circle cx="850" cy="325" r="78"/>
    <circle cx="850" cy="325" r="23"/>
    <line x1="850" y1="247" x2="850" y2="180"/>
    <line x1="790" y1="180" x2="910" y2="180"/>
  </g>

  <g fill="#000000" font-family="Arial, Helvetica, sans-serif">
    <text x="205" y="180" font-size="32" font-weight="700">+5 V</text>
    <text x="205" y="215" font-size="25">5V-VSYS</text>
    <text x="205" y="335" font-size="31" font-weight="700">SERVO MOTOR</text>
    <text x="205" y="375" font-size="27">Conexão 0 ou 1 · PWM</text>

    <text x="690" y="183" font-size="26">VCC</text>
    <text x="670" y="338" font-size="26">SINAL</text>
    <text x="690" y="483" font-size="26">GND</text>
    <text x="760" y="450" font-size="42" font-weight="700">SG90</text>
    <text x="565" y="630" font-size="30" font-weight="700">GND</text>
  </g>
</svg>
